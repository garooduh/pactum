name: pact
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pact
      POSTGRES_DB: pact
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U pact -d pact']
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://pact:${POSTGRES_PASSWORD}@db:5432/pact
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH}
      APP_ORIGIN: https://${DOMAIN:?Set DOMAIN}
      COOKIE_SECURE: 'true'
    volumes:
      - documents:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=3)']
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1536m
    security_opt:
      - no-new-privileges:true
  gateway:
    build:
      context: .
      target: gateway
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - certificates:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
volumes:
  database:
  documents:
  certificates:
  caddy_config:
