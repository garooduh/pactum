name: Test, build and release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check updater security tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_pull_deploy.py' -v
      - name: Test and package the application
        run: bash scripts/deploy.sh --check --output "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pact-${{ github.sha }}
          path: ${{ runner.temp }}/package/
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.repository == 'garooduh/pactum' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pact-${{ github.sha }}
          path: package
      - name: Install pinned signature tool
        run: sudo bash scripts/install-cosign.sh
      - name: Sign the exact tested package using GitHub OIDC
        run: cosign sign-blob --yes --bundle package/release.sigstore.json package/release.tar.gz
      - name: Publish a complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          gh release create "$tag" package/release.tar.gz package/release.sigstore.json package/remote.sh package/SHA256SUMS \
            --target "$GITHUB_SHA" --draft --title "Pact ${GITHUB_SHA:0:12}" \
            --notes "Tested build: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh release edit "$tag" --draft=false --latest
