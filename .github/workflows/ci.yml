name: Test, build and release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check updater security tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_pull_deploy.py' -v
      - name: Test and package the application
        run: bash scripts/deploy.sh --check --output "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pact-${{ github.sha }}
          path: ${{ runner.temp }}/package/
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.repository == 'garooduh/pactum' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pact-${{ github.sha }}
          path: package
      - name: Install pinned signature tool
        run: sudo bash scripts/install-cosign.sh
      - name: Sign the exact tested package using GitHub OIDC
        run: cosign sign-blob --yes --bundle package/release.sigstore.json package/release.tar.gz
      - name: Publish a complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          gh release create "$tag" package/release.tar.gz package/release.sigstore.json package/remote.sh package/SHA256SUMS \
            --target "$GITHUB_SHA" --draft --title "Pact ${GITHUB_SHA:0:12}" \
            --notes "Tested build: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh release edit "$tag" --draft=false --latest
