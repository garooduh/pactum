name: Test, build and release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check updater security tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_pull_deploy.py' -v
      - name: Test and package the application
        run: bash scripts/deploy.sh --check --output "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pact-${{ github.sha }}
          path: ${{ runner.temp }}/package/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  release:
    if: github.repository == 'garooduh/pactum' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pact-${{ github.sha }}
          path: package
      - name: Install pinned signature tool
        run: sudo bash scripts/install-cosign.sh
      - name: Sign the exact tested package using GitHub OIDC
        run: cosign sign-blob --yes --bundle package/release.sigstore.json package/release.tar.gz
      - name: Publish a complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A retry of only this job reuses the original build attempt and artifact.
          tag=$(python3 - <<'PY'
          import json, os, tarfile
          with tarfile.open('package/release.tar.gz') as package:
              build = json.load(package.extractfile('./build.json'))
          assert build['commit'] == os.environ['GITHUB_SHA']
          assert str(build['run_id']) == os.environ['GITHUB_RUN_ID']
          print(f"ci-{build['run_id']}-{build['run_attempt']}-{build['commit'][:12]}")
          PY
          )
          if existing=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [[ "$existing" == false ]]; then
              gh release download "$tag" --pattern release.tar.gz --dir "$RUNNER_TEMP/published"
              cmp package/release.tar.gz "$RUNNER_TEMP/published/release.tar.gz"
              echo "The identical release is already published."
              exit 0
            fi
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --title "Pact ${GITHUB_SHA:0:12}" \
              --notes "Tested build: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
          gh release upload "$tag" package/release.tar.gz package/release.sigstore.json package/remote.sh package/SHA256SUMS --clobber
          gh release edit "$tag" --draft=false --latest
      - name: Check current public HTTPS
        continue-on-error: true
        run: curl --fail --silent --show-error --max-time 20 https://pactum.qbob.ru/api/health
